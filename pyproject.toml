[tool.poetry]
name = "mrphy-py"
version = "0.2.0"
description = "A Pytorch based tool for MR physics simulations"
authors = ["Tianrui Luo <tianrluo@umich.edu>"]
license = "MIT"
readme = "README.md"
packages = [{include = "mrphy"}]

[tool.poetry.dependencies]
python = ">=3.8"
numpy = ">=1.22"
scipy = ">=1.8"
torch = ">=1.13"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
